[project]
name = "qtx-modespace"
version = "0.3.0"
description = "Mode-space basis for QuaTrEx devices: level-1 (local) and level-2 (global) density-matrix slab or tile modes, spurious lead-band cleanup, transmission check, FGMRES with a CAP-Schwarz smoother"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "h5py>=3.9",
]

[project.optional-dependencies]
fast = ["pypardiso>=0.4; platform_machine == 'x86_64' or platform_machine == 'AMD64'", "threadpoolctl>=3.1"]
plot = ["matplotlib>=3.8"]
gpu = ["cupy-cuda12x>=13"]          # --gpu: dense parts on an NVIDIA GPU, CUDA 12 driver
gpu13 = ["cupy-cuda13x>=14"]        # CUDA 13 driver (e.g. GH200 with driver 610)
test = ["pytest>=8"]

[project.scripts]
qtx-modespace = "qtx_modespace.cli:main"
qtx-modespace-obc-eig = "qtx_modespace.obc_eig:main"
qtx-modespace-prep = "qtx_modespace.prep:main"
qtx-modespace-plot = "qtx_modespace.plot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qtx_modespace"]

[tool.hatch.build.targets.sdist]
exclude = ["data", "dist"]
artifacts = ["examples/*.sh", "scripts/*.sh", "scripts/alps/*"]          # the repo .gitignore hides examples/ (device data); keep the scripts
