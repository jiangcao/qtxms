[project]
name = "qtx-modespace"
version = "0.2.0.dev0"
description = "Mode-space basis for QuaTrEx devices: direct level-2 slab modes, spurious lead-band cleanup, transmission check"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "h5py>=3.9",
]

[project.optional-dependencies]
fast = ["pypardiso>=0.4; platform_machine == 'x86_64' or platform_machine == 'AMD64'"]
plot = ["matplotlib>=3.8"]

[project.scripts]
qtx-modespace = "qtx_modespace.cli:main"
qtx-modespace-obc-eig = "qtx_modespace.obc_eig:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qtx_modespace"]

[tool.hatch.build.targets.sdist]
exclude = ["data", "dist"]
