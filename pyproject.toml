[project]
name = "qtx-ms"
version = "0.1.0"
description = "Mode space as the coarse level of a multigrid transport solver (qtx_ms) + two-level mode space (qtmode)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.18.1",
    "pypardiso>=0.4.7; platform_machine == 'x86_64' or platform_machine == 'AMD64'",   # MKL wheels: x86-64 only; elsewhere qtmode/_pardiso_compat.py
    "matplotlib>=3.11.2",
    "h5py>=3.16.0",
    "threadpoolctl>=3.7.0",
]

[project.optional-dependencies]
qtx = [
    "mpi4py>=4.1.2",
    "numba>=0.68.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qtx_ms", "qtmode"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
